                description: 'Found on the lush Pyramidal tree forms of the moon, the Moon Apple is a vibrant fruit that offers a quick boost of energy. If what they say about an apple being more effective than a cup of coffee is true, then the Moon Apple is more effective than three.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/resources/Moon_Apple.png'
              - id: ippmf_6
                label: 'Purple Fish'
                description: 'The purple moon fish found in lakes has green fins and spots. These tiny accents provide a saltier taste, regardless of the usual sweetness of lake fish.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/resources/Purple_Moon_Fish.png'
              - id: ipkmf_7
                label: 'Pink Fish'
                description: 'The Pink Moon Fish, also found in lakes, is the highest source of Energy. It is much sweeter than the purple, due to its yellow fins and neon trimmings.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/resources/Pink_Moon_Fish.png'
          - id: special_food
            label: 'Special Food'
            icon: 'category_special_food'
            children:
              - id: ismb_8
                label: 'Special Berry'
                description: 'This berry can be spotted near the outer edges of the lakes and is specifically for the Moon Creatures. They favor the bitterness of the yellow seeds in this magical fruit.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/resources/Special_Moon_Berry.png'
              - id: ismf_9
                label: 'Special Fish'
                description: 'A sweet and salty fish, only found in rivers. River fish is for Moon Creatures in particular, as they enjoy the unusual, acquired taste of it.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/resources/Special_Moon_Fish.png'
              - id: ismp_10
                label: 'Special Plant'
                description: 'Flowering up the walls of the caves, the Special Moon Plant is for the Moon Creatures and offers them the highest source of Special Energy. The plant is so vibrant and beautiful that it is no surprise it holds poisonous qualities, but not for the Moon Creatures. They have a unique digestive system that can kill any harmful ingredients and convert it to Special Energy.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/resources/Special_Moon_Plant.png'
      - id: tools
        label: 'Tools'
        icon: 'equipment'
        weight: 3
        children:
          - id: mining
            label: 'Mining'
            icon: 'category_mining'
            weight: 3
            children:
              - id: pickaxe
                label: 'Pickaxe'
                description: 'Sharper than a great white''s teeth, this pick can puncture through any type of rock or surface on the moon.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/tools/Mining_Pick.png'
                weight: 2
              - id: drill
                label: 'Drill'
                description: 'Able to pierce through concrete, rock, or diamond- the Hammer Drill is a must have tool on the moon. Nails included!'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/tools/Hammer_Drill.png'
                weight: 1
          - id: building
            label: 'Building'
            icon: 'category_building'
            weight: 2
            children:
              - id: welder
                label: 'Welder'
                description: 'The welding machine is designed to quickly fuse any materials together. Unlike the average equipment, engineered specially for metals, plastics and woods, the moon welding machine works on any material imaginable.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/tools/Welding_Equipment.png'
                weight: 2
              - id: cutter
                label: 'Cutter'
                description: '[example] A powered cutting tool for shaping construction material and dismantling salvage.'
                weight: 1
              - id: ipe_31
                label: 'Paint Tools'
                description: 'What would the universe be without a little décor and style? Regardless of being black, white and grey, both the brush and ruler spread tasteful design all over the Cryptonaut''s side of the moon.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/tools/Painting_Equipment.png'
              - id: ispd_32
                label: 'Spade'
                description: 'This lightweight digger is the most efficient and convenient of the shovel family. Offering a strong grip, this tool makes any project a breeze.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/tools/Spade.png'
              - id: ibt_33
                label: 'Bucket and Trowel'
                description: 'Impressive masonry is in the details, which is why this duo is a go-to for all brick and stonework. Crafted with smooth metal and fine edges, the trowel and its other half are essential for any type of construction.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/tools/Bucket_and_Trowel.png'
              - id: ips_34
                label: 'Power Saw'
                description: 'With blades of steel, this tool can seriously slice. Regardless of its great force, ultimate control is part of the package and will be appreciated by all masters of saw.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/tools/Powered_Saw.png'
              - id: itb_37
                label: 'Tool Box'
                description: 'Every handy Cryptonaut''s dream- this Tool Box holds all the necessities to build and fix nearly anything on the moon. Each tool has its own place in this all-encompassing set.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/misc/Tool_Box.png'
              - id: imcl_38
                label: 'Moon Closet'
                description: 'The Moon Closet houses all necessary tools needed to build Moon Infrastructures.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/misc/Moon_Closet.png'
          - id: utility
            label: 'General'
            icon: 'category_utility'
            weight: 1
            children:
              - id: scanner
                label: 'Scanner'
                description: '[example] A handheld survey device for inspecting nearby terrain, resources, and creatures.'
                weight: 2
              - id: beacon
                label: 'Beacon'
                description: '[example] A deployable marker for identifying a route, meeting point, or survey location.'
                weight: 1
              - id: ifr_17
                label: 'Fishing Rod'
                description: 'Top of the line rod with an easy to use hook for bait. Get ready to reel in the biggest and finest catches!'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/tools/Fishing_Rod.png'
              - id: iwc_18
                label: 'Water Can'
                description: 'Offering water to the Moon and Special Moon Seeds in the Greenhouses, this can holds a lot more than it would seem. Made with a special absorbent material found on the moon''s surface, this can is able to hold double its storage area, without affecting the water''s quality and cleanliness.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/tools/Water_Can.png'
              - id: is_19
                label: 'Shovel'
                description: 'Designed with a nose of two meeting 45-degree angles, this shovel will skilfully pick up the remains of the pick''s job. Get ready to dig deep with this handy tool.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/tools/Shovel.png'
              - id: ia_21
                label: 'Axe'
                description: 'This rare tool allows for the clearing of forest space on Moon Plots to make way for Moon Infrastructures. This hatchet is state-of-the-art and is able to chop down any tree, no matter its density.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/tools/Axe.png'
              - id: ipot_22
                label: 'Oxygen Tank'
                description: 'The Portable Oxygen Tank helps Cryptonauts to travel across to the Dark Side of the Moon, regardless of atmospheric conditions. This tiny capsule holds volumes of compressed gas and will last for hours as Cryptonauts make the most of their time there. The use of space aluminium as its main material makes it lightweight and portable for those longer journeys.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/misc/Portable_Oxygen_Tank.png'
      - id: guardians
        label: 'Guardians'
        icon: 'guardian'
        weight: 4
        children:
          - id: hodl
            label: 'HODL'
            image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/babies/HODL.png'
            description: 'Prankster, always ready for a good time. HODL knows what goes down must come up in outer space, so she holds on for the long haul. She''ll always come out on top, gold chains and all.'
            weight: 1
            gender: 'female'
          - id: neon
            label: 'NEON'
            image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/babies/NEON.png'
            description: 'NEON may seem a little unpredictable, or even radioactive at first, but that''s just his dynamic, spirited-self, shining through. What lies beneath is the perfect balance of pragmatic idealism, which gets him through any storm.'
            weight: 1
            gender: 'male'
          - id: opal
            label: 'OPAL'
            image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/babies/OPAL.png'
            description: 'The opal stone may confirm his predictions, but OPAL knows the future long before, thanks to the power of insight. OPAL reminds everyone that the circle of fortune responds well to unwavering faith, as lady luck inevitably makes her return to the top.'
            weight: 1
            gender: 'male'
          - id: orba
            label: 'ORBA'
            image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/babies/ORBA.png'
            description: 'Suffering from a petty mortal problem? Call the great and powerful ORBA to make it all go away. This extra-terrestrial is sitting pretty on the throne for a reason- confidence is queen.'
            weight: 1
            gender: 'female'
          - id: hold
            label: 'HOLD'
            image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/babies/HOLD.png'
            description: 'As a wise baby once said, “This bear shall pass.” And that baby was HOLD. Just because he is the king of waiting (and it’s clearly paid off- check out those chains), doesn’t mean he doesn’t know how to have fun or look good while doing so. Get ready for a wild time.'
            weight: 1
            gender: 'male'
          - id: neom
            label: 'NEOM'
            image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/babies/NEOM.png'
            description: 'Ever heard of hurricane NEOM? Her frantic energy keeps her high-up in space, but luckily, a sense of pragmatism inherited from an earlier generation anchors her to the moon’s surface when needed, creating true harmony. Hey, every hurricane has its eye.'
            weight: 1
            gender: 'female'
          - id: opla
            label: 'OPLA'
            image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/babies/OPLA.png'
            description: 'Just a spunky gal with a crystal ball. Of course, OPLA can tell the future through her trusty stone, but she has the ability to understand how it all plays out beforehand. I mean, what good is a snapshot of the future without its back story, and a spirited medium who is eager to help reach the best possible outcome?'
            weight: 1
            gender: 'female'
          - id: orbt
            label: 'ORBT'
            image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/babies/ORBT.png'
            description: 'Don’t believe in magic? Then you haven’t met ORBT. With an infectious smile and “come at me attitude” that somehow work very well together, this baby will make any problem disappear into the vacuum that is space- all from the comfort of his throne.'
            weight: 1
            gender: 'male'
          - id: blok
            label: 'BLOK'
            image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/babies/BLOK.png'
            description: 'This moon baby''s got all the essentials for building his way to the top and we''re not just talking about legos. With the vision of how contrasting parts fit and work together, BLOK uses both his analytical and creative skills to achieve greatness.'
            weight: 1
            gender: 'male'
          - id: comi
            label: 'COMI'
            image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/babies/COMI.png'
            description: 'Never looking down or back, COMI is always ready for what''s in front of her. You may think because of the serious wind under her board she lacks grounding, but COMI is the most cognizant and present moon baby there is. Not to mention she is also the fastest, but that''s just a plus.'
            weight: 1
            gender: 'female'
          - id: fomo
            label: 'FOMO'
            image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/babies/FOMO.png'
            description: 'His name may imply a worry of letting the rocket ship pass, but that''s never the case as FOMO makes the most of every momentous chance he can get (no need to mention the Moon Device in hand…) This opportunist exudes bravery when embarking on a new path and never decides out of fear.'
            weight: 1
            gender: 'male'
          - id: zena
            label: 'ZENA'
            image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/babies/ZENA.png'
            description: 'Perception is everything on the moon as things are never as they seem. With the innate ability to look at a situation from an a-typical angle, ZENA''s uber cool space speks offer her even more insight to unforeseeable situations. This is one wise moon baby with an unconventional approach.'
            weight: 1
            gender: 'female'
          - id: comt
            label: 'COMT'
            image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/babies/COMT.png'
            description: 'COMT and his curious pacifier allow him to soar high above the haters. Any whining or gossip? No bueno. It isn''t just this baby''s binky that puts him on higher ground, but it''s his ability to block out unproductive negativity that does the trick.'
            weight: 1
            gender: 'male'
          - id: fomi
            label: 'FOMI'
            image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/babies/FOMI.png'
            description: 'The queen of opportunity herself, holding all that sovereignty in a magnificent moon device! As if! FOMI is the definition of power with or without the device, but it certainly helps give that tiny little thing some height.'
            weight: 1
            gender: 'female'
          - id: lock
            label: 'LOCK'
            image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/babies/LOCK.png'
            description: 'LOCK knows if you want something done right, you better build it yourself and build she will with her magical blocks. This baby has the ability to design and construct the most magnificent infrastructures the moon has ever seen. Of course, she tends to hold back in order for the Cryptonauts to learn a thing or two.'
            weight: 1
            gender: 'female'
          - id: zion
            label: 'ZION'
            image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/babies/ZION.png'
            description: 'ZION can see what''s going on anywhere in the universe. Nothing goes unnoticed with this baby thanks to his trusty blinkers. With one tap of his stumpy finger on the virtual map in front of his face, ZION is privy to all the happenings of the moon.'
            weight: 1
            gender: 'male'
