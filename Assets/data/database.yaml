                gender: 'female'
              - id: c089
                label: 'Cryptonaut .089'
                description: 'As if there wasn’t already enough of a lack of gravity on the moon….but maybe it’s the irony of it all that makes .089 such a hilarious guy. He’s always willing to share some air on his trampoline.'
                image: 'https://ttm.mypinata.cloud/ipfs/QmS9iwZoRWgBG5SWzEadfNB6f258a66NfV5GinxrMkeuCG'
                gender: 'male'
              - id: c090
                label: 'Cryptonaut .090'
                description: 'With an impeccable taste in music, .090 knows the best of every genre. You ask for it, he’s got it! This Cryptonaut makes all the moon beats for the universe to enjoy and serves them with a side of warmth and passion that no other entertainer does.'
                image: 'https://ttm.mypinata.cloud/ipfs/QmYX4HFGv7Z9eS2PKc77MihUAGinSKexLDNF4a9ZzZiwNA'
                gender: 'male'
              - id: c091
                label: 'Cryptonaut .091'
                description: 'Of course, .091 is always at ease - he’s carrying more than most can imagine. Radiating positivity and quiet confidence, this Cryptonaut knows true treasures are found among the stars and kept safe in the bag.'
                image: 'https://ttm.mypinata.cloud/ipfs/QmV6Ab4MvyTqebTgYpZHhpmTX2CWvwpgq1P935EYt6L6kY'
                gender: 'male'
              - id: c092
                label: 'Cryptonaut .092'
                description: 'Master of the curve shot, .092 gets every ball into the pocket. This must be from his clever and quick nature. An approachable guy, always down for a game who keeps everyone laughing with his tricks.'
                image: 'https://ttm.mypinata.cloud/ipfs/QmUeULAsqy36FfqLqULRb9Y6tYNFn2ZjvnRbRxn5eR6kUa'
                gender: 'male'
              - id: c093
                label: 'Cryptonaut .093'
                description: 'Ready to go wherever life takes her, .093 is always ready for a whimsical adventure. But open her suitcase and you’ll see she only carries the basic essentials and does not let frivolous objects slow her down. This Cryptonaut is all about the experience!'
                image: 'https://ttm.mypinata.cloud/ipfs/QmUi9tBU1AUa1kMUXmyV6kN2KrwD9KZsWM8mnBBRsxAvdm'
                gender: 'female'
              - id: c094
                label: 'Cryptonaut .094'
                description: 'Good luck getting an appointment with the moon’s top hair stylist. .094 is a master artist who stays true to the rules of styling- No rounded bangs on a diamond face! But part of his appeal is his appreciation for his clients, as he never takes his business for granted.'
                image: 'https://ttm.mypinata.cloud/ipfs/QmfPSuWG7AXCCE8QeSrcv4zivaTDEtx1wb465qJYJRw82z'
                gender: 'male'
              - id: c095
                label: 'Cryptonaut .095'
                description: 'The Universe’s resident Moon Cave Specialist. This speleologist has a one-track mind set on reaching depths of caves no one even knows exist! And also, in record-breaking time no one even knows is possible! The need to find what lies inside in the depths is what drives .095 on his journey.'
                image: 'https://ttm.mypinata.cloud/ipfs/QmV6EU6ijyVtPLGYJuyTBwpmjLsgewaNxdCadiAyLUUPQu'
                gender: 'male'
              - id: c096
                label: 'Cryptonaut .096'
                description: 'A creative soul who prefers to do his work in peace. That’s why .096 is an artist of the night. Though not many see him around, they have all come to appreciate his meaningful work.'
                image: 'https://ttm.mypinata.cloud/ipfs/Qman77oomYdkDu5arpuQLga9UxSgoomgjgWHtY1ieDFVbe'
                gender: 'male'
              - id: c097
                label: 'Cryptonaut .097'
                description: 'The most gracious show-stopper you’ll ever meet. Regardless of his talent .097 is as unpretentious as they come and he is loved all the more for it.'
                image: 'https://ttm.mypinata.cloud/ipfs/QmXnHjM5km3Pv91Sa7aB86P1Xznx2N7iwBYTwzcZhgpZCu'
                gender: 'male'
              - id: c098
                label: 'Cryptonaut .098'
                description: 'The only thing more fun than flying a kite on a windy day on earth, is flying one on the moon. .098 knows what’s good. It’s all fun and games when you are this campy and big-hearted!'
                image: 'https://ttm.mypinata.cloud/ipfs/QmNwhhtGZjsSccP5oDPkPbozaPXX2s6nQPgoFiywnPyMXu'
                gender: 'female'
              - id: c099
                label: 'Cryptonaut .099'
                description: 'Catch her at the Moonporium taking advantage of the best deals. .099 is a passionate couponer, always looking to discover the best finds tokens can buy.'
                image: 'https://ttm.mypinata.cloud/ipfs/Qmdt76FJzB1vErkZgyRFT6nyrZSBYWmSpVMa5wwCay2uGM'
                gender: 'female'
              - id: c100
                label: 'Cryptonaut .100'
                description: 'Some call it being in the right place at the right time, others call it a coincidence, but somehow, this Cryptonaut always manages to discover the most valuable runes of the moon’s surface. Fortunately for him, no one is jealous of his riches and are instead drawn to him because of .100’s pure nature.'
                image: 'https://ttm.mypinata.cloud/ipfs/QmX3FbjnKzreH8myYA9Kvbb5jH2RgYVCBRqaKfhgY8dT4F'
                gender: 'male'
              - id: c101
                label: 'Cryptonaut .101'
                description: 'This enlightened Cryptonaut seeks the more bucolic side of the moon. Find .101 hidden amongst the serene mountains, absorbing all the knowledge a Cryptonaut can.'
                image: 'https://ipfs.tothemoon.net/ipfs/QmTL9w9VUoeuGaHpi9C1Fq35SuMFCgqSCV7SsFPyky8tuk'
                gender: 'male'
              - id: c102
                label: 'Cryptonaut .102'
                description: '90''s nostalgia anyone? You may think the boom box is passe, but .102 is bringing it back and this time, to the moon. This Cryptonaut is full of good vibes and uses creativity to liven up any lackluster space.'
                image: 'https://ipfs.tothemoon.net/ipfs/QmXuz62f59jgEgyByYv4Xv1ipS42y8yafmumFMUJPaR3Ad'
                gender: 'female'
              - id: c103
                label: 'Cryptonaut .103'
                description: 'Make love, not war. .103 is one gentle soul whose unwavering belief carries this flower child through life. Just like the flower, this Cryptonaut is sewn to the environment around it.'
                image: 'https://ipfs.tothemoon.net/ipfs/QmX7hdmmK8DTH4TjBZT3k5FVoSZY22PiFR6HNG7Zc3RVqN'
                gender: 'male'
              - id: c104
                label: 'Cryptonaut .104'
                description: 'The quick movements of .104 are nearly invisible to the naked eye. This martial arts master is ready to adjust based on the threat before her. She has a talent for anticipation. Though .104 could, she would never hurt another and only utilizes her talents when defense is necessary.'
                image: 'https://ipfs.tothemoon.net/ipfs/QmbqrYbFF49gwkEEjq1dz1juu1dQJbEQGZefAuUPy2PZo9'
                gender: 'female'
              - id: c105
                label: 'Cryptonaut .105'
                description: 'Probably the moon''s toughest bouncer- there will be no casual entry into the vault on .105''s watch. There is a certain vision to his work as he feels out who''s in it for the long run and who''s not. And if you''re a dumper- Access denied!'
                image: 'https://ipfs.tothemoon.net/ipfs/QmdtVhQSht8c2xdrB17C5BhuQEWDJWtDchXLgc2F18VS9J'
                gender: 'male'
              - id: c106
                label: 'Cryptonaut .106'
                description: 'This is one smooth Cryptonaut. .106 has the skills to dance his way through any obstacle with incredible energy and passion. Swerve.'
                image: 'https://ipfs.tothemoon.net/ipfs/QmV47x8yoYqpAkLR4gxesu1fwDhQiAgJDGcb2TDjTzfq2K'
                gender: 'male'
              - id: c107
                label: 'Cryptonaut .107'
                description: 'With the natural ability to sense what lies beyond the thick surface of the moon, .107 is never short of direction. This Cryptonaut knows the way and with blessings from the universe gets it right every time.'
                image: 'https://ipfs.tothemoon.net/ipfs/QmPGbxWC7omw4oUi1nWRwqLB43CpaFiodqcU6oND8UYdDV'
                gender: 'female'
              - id: c108
                label: 'Cryptonaut .108'
                description: 'You can always count on this resourceful soul to help things grow. .108 keeps his focus on the future and won’t stop watering progress until every mission blooms.'
                image: 'https://ipfs.tothemoon.net/ipfs/QmQkRsZYAtzMWWUuNM9JxZSHwumyE12APqj99gki7JzCh2'
                gender: 'male'
              - id: c109
                label: 'Cryptonaut .109'
                description: 'This Cryptonaut''s child-like wonder is what keeps him tied to a virtual reality of his own. You''d think .109 lives in another world and therefore exemplifies the more absent-minded qualities a human can have, but on the contrary, he has the tenacity and intelligence of the most apprehensive beings of the entire universe.'
                image: 'https://ipfs.tothemoon.net/ipfs/QmVcUN9VFjHUTrBZsANAM2zjGJjdoAQ398qH9DgnXGohfo'
                gender: 'male'
              - id: c110
                label: 'Cryptonaut .110'
                description: 'This expert of espionage will contort his way through any crevice. .110 is a compassionate Cryptonaut, who uses his shuriken (throwing stars) as a delaying tactic, not to pierce his opponents.'
                image: 'https://ipfs.tothemoon.net/ipfs/QmNtDMqNtW5CMXyCKb9wGcay9Ysu9cCbJ9gog5YkFWvdhN'
                gender: 'male'
              - id: c111
                label: 'Cryptonaut .111'
                description: '.111 moves with air in the tank and no fear in the step. When the mission calls for extra oxygen, he’s already in motion. Others try to match this charge-ahead energy, but can’t replicate this Cryptonauts unique spark.'
                image: 'https://ipfs.tothemoon.net/ipfs/QmTGdmBuMvHFQ67UbMyspZcTK9JygoYzwjpt8kZBg6bqWz'
                gender: 'male'
              - id: c112
                label: 'Cryptonaut .112'
                description: 'If anyone should be the gang''s main source of spiritual illumination, it''s .112. With her magnetic, bright energy, this Cryptonaut can handle revealing the path to enlightenment. Think not of her as a teacher, but simply a revealer.'
                image: 'https://ipfs.tothemoon.net/ipfs/QmafHs1PwYboyDU8hQzBct9pxHCLXXER6jk4jCmJtpSNWM'
                gender: 'female'
              - id: c113
                label: 'Cryptonaut .113'
                description: 'You have to have complete trust in the universe when you''re falling 14,000 feet through the galaxy sky. All his successful jumps and lands on the moon''s surface have made .113 one self- assured, outgoing Cryptonaut.'
                image: 'https://ipfs.tothemoon.net/ipfs/Qma5iMP99iRgtkJxroacvScRruMNVY2325aiS6uzj7xyn4'
                gender: 'male'
              - id: c114
                label: 'Cryptonaut .114'
                description: 'The diploma is a symbol of tenacity and maturity as it reminds one of the years of effort traded off for being called up to the podium. .114 represents these same virtues as she has the discipline to reach any goal, academic or not. Hats off, Grad!'
                image: 'https://ipfs.tothemoon.net/ipfs/QmV7ZbjgsbbEdYxMJwpen9n3GqznxxAPub9tSSDqKRcLXQ'
                gender: 'female'
              - id: c115
                label: 'Cryptonaut .115'
                description: 'You would think he was a greedy Cryptonaut, but on the contrary loves to share his most beloved dishes and is always down to make merry around the table. Believe it or not, he is also a vegetarian who promotes a green lifestyle. Bon Appetit!'
                image: 'https://ipfs.tothemoon.net/ipfs/QmdybpHg5LqVoARpZYzJXe6iZYkqLCMRERJYzgtUv2RJ4B'
                gender: 'male'
              - id: c116
                label: 'Cryptonaut .116'
                description: 'Discipline does not dull .116’s natural charm or sharp humor. He’s a lively presence who pilots every mission with style and precision. Need direction through uncertain skies? Just ask the Cryptonauts’ trusted aviator to lead the way.'
                image: 'https://ipfs.tothemoon.net/ipfs/QmR1TbSxqfU7VGSfCDhPEG22tdTdZ2vasJZeSDnCJdAtcL'
                gender: 'male'
              - id: c117
                label: 'Cryptonaut .117'
                description: 'You just know .117 will catch the ball, no matter how high or extravagant the toss is. As predictable as a machine, this Cryptonaut has plenty of talent but will never be the one to brag about it- a true entertainer at heart.'
                image: 'https://ipfs.tothemoon.net/ipfs/QmQafE1qtVmk5ajc2Q1BpHiW97PsrsE5eqoYaa4bNgepYr'
                gender: 'female'
              - id: c118
                label: 'Cryptonaut .118'
                description: 'Kick back, relax, and enjoy the lull. .118 certainly has this sequence mastered. Without a care in the world, this Cryptonaut knows all will turn out as it should, as long as one focuses on and contributes to the good.'
                image: 'https://ipfs.tothemoon.net/ipfs/QmXSCpBEE392TQZbvP3FDW1XW9c2De5GrSVgt746ZUV2y5'
                gender: 'female'
              - id: c119
                label: 'Cryptonaut .119'
                description: 'Can you keep up? .119 certainly can. Always ready to serve up something better than the last round, this Cryptonaut won’t leave the pan until the job is done. Unless, of course, friends are nearby - then the only thing being cooked is a good time.'
                image: 'https://ipfs.tothemoon.net/ipfs/QmaES8nkDPupfP9RfwxCTBEncy7xC3MekvH4BpGJ15LvYS'
                gender: 'female'
              - id: c120
                label: 'Cryptonaut .120'
                description: 'A bit of a daredevil. Spends most of his time making his wrongs, right. .120''s focus is to live it up, even if that means paying for it later. But this bad boy is harmless with his only crime being trying to keep the gang in stitches.'
                image: 'https://ipfs.tothemoon.net/ipfs/QmUcoAp5bxZYgQiR46Pn3iv7YWvYS4QxMma4rpds4kYGJW'
                gender: 'male'
              - id: c121
                label: 'Cryptonaut .121'
                description: 'A truly generous soul. .121 always considers the future generations and what will be left for them. She understands that good things (like vegetation and organic foods) take time to grow, yet continues to display selflessness through her dedication to caring for Cryptonauts she may never meet.'
                image: 'https://ipfs.tothemoon.net/ipfs/QmefMzJCSzqjQ3d1sCa6LWnsfkdYPREVjwoAb9Hpu5mQuj'
                gender: 'female'
              - id: c122
                label: 'Cryptonaut .122'
                description: 'Good luck spectating a match with .122 playing. You won''t even spot the ball because of her quick drives and smashes. Many believe she can accurately play out the entire game in her head before reaching the table for first serve. This Cryptonaut''s grit is simply remarkable and unmatchable!'
                image: 'https://ipfs.tothemoon.net/ipfs/QmPTohRUEY38hTXGBrsv37s95YtEsY4SVpF8A4ueV73Vgn'
                gender: 'female'
              - id: c123
                label: 'Cryptonaut .123'
                description: '.123 definitely holds the most life experience after living out many full years, but does not act like the senior he is. His zest for life, combined with all the lessons he''s learned make him one of the most popular and interesting Cryptonauts, especially amongst the youth!'
                image: 'https://ipfs.tothemoon.net/ipfs/QmeGGoYnTTGmNFCYWT95QqpT3iVs3h52uzpi1fY6J3W5CS'
                gender: 'male'
              - id: c124
                label: 'Cryptonaut .124'
                description: 'This Cryptonaut loves to be suspended mid air, even if it''s only to dangle and hang. .124 is the first to reach any destination, but does so while maintaining an ease to her technique.'
                image: 'https://ipfs.tothemoon.net/ipfs/QmcNnqssjcG5CVuMBvQbbte89xzZJNRH6NEe2Z7ZEHUQYk'
                gender: 'female'
              - id: c125
                label: 'Cryptonaut .125'
                description: 'Put your hands up and enjoy the way down! .125 is all about the feeling in her stomach when she lets gravity do its job. Her playful, engaging attitude feeds her need-to-discover way of life.'
                image: 'https://ipfs.tothemoon.net/ipfs/QmXfu4y5tqNuKM2HpuW7fVp6wXfSzUgF38j9sVtXBQcj3t'
                gender: 'female'
              - id: c126
                label: 'Cryptonaut .126'
                description: 'This courteous Cryptonaut serves sincerity on a silver platter. .126 is the most gracious host who is a magnet to those around him, not because of his hospitality, but because of his massive heart.'
                image: 'https://ipfs.tothemoon.net/ipfs/Qmf25mB6K5rxyVUu4YF28hfRMaGBaSH6tLLpYiS4C8Xmpy'
                gender: 'male'
              - id: c127
                label: 'Cryptonaut .127'
                description: '.127 understands a solid base comes from hardworking, steady hands. This Cryptonaut always delivers great work, on time, making her one of the best builders on the moon.'
                image: 'https://ipfs.tothemoon.net/ipfs/QmVWCbyjUF2VXjEKAyTaGL22zNaji71woFD4gajan563bt'
                gender: 'female'
              - id: c128
                label: 'Cryptonaut .128'
                description: 'This creative soul maintains her playfulness and innocence through seeking pleasure in the simple things of life. .128 is a whimsical character who''s sure to blow everyone away!'
                image: 'https://ipfs.tothemoon.net/ipfs/QmTQayWtwC6iMKoGHRSD1Q4t8Rq3UDxo2S81pFiPF9nAJs'
                gender: 'female'
              - id: c129
                label: 'Cryptonaut .129'
                description: 'When lifting this heavy, one must be sensible and accountable for the goal set out to reach. This is what makes .129 one the greatest lifters the moon has ever seen. He is steadfast, yet ensures to always have a spotter nearby.'
                image: 'https://ipfs.tothemoon.net/ipfs/QmPSVogrdGqgkx7mhAojFm4HXCqa8B6i6Ec1nJeAkVormZ'
                gender: 'male'
              - id: c130
                label: 'Cryptonaut .130'
                description: 'Ready to reach heights no one has reached before! .130 is prepared for whatever size rock the mountain may send tumbling his way. This explorer has a goal to touch every snow-brushed peak and see every breathtaking view.'
                image: 'https://ipfs.tothemoon.net/ipfs/QmZmUAk33yRJ8kiHgZRki2L12PsJW857cHiSSB3vgcbVgF'
                gender: 'male'
              - id: c131
                label: 'Cryptonaut .131'
                description: '.131 is all about going with the flow. Only once he reaches full acceptance of the stream''s movement, can he readjust to any obstacles in the way. Along with the path of least resistance, this Cryptonaut understands the ebbs of generosity- what you give is what you get.'
                image: 'https://ipfs.tothemoon.net/ipfs/Qmae42EQR2hnSFnx2sDvuNfYW6TXZn4wqJB6yKafi3vGRu'
                gender: 'male'
              - id: c132
                label: 'Cryptonaut .132'
                description: 'The moon''s resident stuntman loves to set his sight on impossible heights and reach them. .132 is sure of himself, but even when he doesn''t make the ollie, shows the values of a true sportsman.'
                image: 'https://ipfs.tothemoon.net/ipfs/QmeWTTDZj1BYgqQdi2Besy9KgWb4tBF5oMud3kFnXK86MX'
                gender: 'male'
              - id: c133
                label: 'Cryptonaut .133'
                description: 'In the blink of an eye, watch her vanish into the horizon with her killer front stroke. This Cryptonaut can make a speed boat look like a lazy duck cruising its way down the river. .133''s gusto for and passion for life seep through her perma-mood of whimsicality.'
                image: 'https://ipfs.tothemoon.net/ipfs/QmT1kWxGz3xVJAKbEzhRUNRZYGSwGVAd2niLQMBengtpUp'
                gender: 'female'
              - id: c134
                label: 'Cryptonaut .134'
                description: 'Cryptonauts line up for miles outside his shop, even if it''s just to get a whiff of his famous cornbread. With a heart of gold, it''s hard for .134 to not have enough for everyone but his baked goods are just too irresistible to be able to keep up with the demand. Luckily, his bakery assistants help him out a bit, so he can still charm the crowds while maintaining his jolly Ol'' town baker status.'
                image: 'https://ipfs.tothemoon.net/ipfs/QmcroPctZRt5rCqZEnW53JZrgexpPLPEt74uyZfhxojvUU'
                gender: 'male'
              - id: c135
                label: 'Cryptonaut .135'
                description: 'The job of the farmer is no joke. .135 is up before the sun and still tending to the crops long after it disappears for the day. Fortunately, this Cryptonaut understands the value of hard work and how the payoff only multiplies with time.'
                image: 'https://ipfs.tothemoon.net/ipfs/QmaT3E4WDZMDZSzGrNZLWN3cXDaAK49CUfFXRuypL6s4LG'
                gender: 'male'
              - id: c136
                label: 'Cryptonaut .136'
                description: 'No melancholy pieces here. This prodigy''s song will turn a dark day into the brightest meteor shower and her personality will do the same. .136 is quite a phenomenon of the moon.'
                image: 'https://ipfs.tothemoon.net/ipfs/QmcmVpEzUsueahiRUnp5cmUThVFLbBjrj9m5Dw1MkBtxsv'
                gender: 'female'
              - id: c137
                label: 'Cryptonaut .137'
                description: 'You may think .137 does nothing but sweep the same spot all day, but no corner of the universe escapes this Cryptonaut’s notice. This sharp-minded soul always finds the bright side and keeps every path clear for others. So regardless of all that gets stirred up, .137 could never be called anything but a force for good.'
                image: 'https://ipfs.tothemoon.net/ipfs/QmPwUp9dYYqpUmXEcgUXw3kcw1Rb22dpGdSV2TMnM7Ayms'
                gender: 'female'
              - id: c138
                label: 'Cryptonaut .138'
                description: 'Not sure if you heard, but tradespeople are always in demand on the moon. It''s not easy to arrange for one''s services and if you do, they may not show up because they are requested at a bigger job elsewhere, but not this craftsman, wherever he commits to be, he''ll be. .138 is ready to work and his word is as solid as wood.'
                image: 'https://ipfs.tothemoon.net/ipfs/QmZ5YzrUEQuGo5cGYzDh4MSoFQXCTG8SvYyS2AJD57NQgG'
                gender: 'male'
              - id: c139
                label: 'Cryptonaut .139'
                description: 'Gather around the fire with this zany Cryptonaut. .139 always has a hilarious campfire story to share. Basically, if you ever get an invite to join her, you''d be crazy not to…and don''t worry about the marshmallows- she''s literally got a life supply! S''mores up!'
                image: 'https://ipfs.tothemoon.net/ipfs/QmdrgLzshbKJfBMeTZo9iURS6nw6q66DVWyeuwMBoGbQsu'
                gender: 'female'
              - id: c140
                label: 'Cryptonaut .140'
                description: 'The real Iron Man. People say .140 has hands of gold that form the most incredible objects and can withstand such extreme temperatures-bare! Maybe that''s the secret as to how quick he works. Also, if ever in need of a laugh, sit in at his shop. This Cryptonaut loves to spew jokes while crafting.'
                image: 'https://ipfs.tothemoon.net/ipfs/QmTEcYN3LouHX3h84pnxC6VdGKdqknZUuLwY7cy5VgxuYb'
                gender: 'male'
              - id: c141
                label: 'Cryptonaut .141'
                description: 'It takes plenty of vision to see beyond the blob of clay .141 begins molding with. Only through this vision can she make the most incredible ceramics with intricate designs. Her hands are her guide as she quietly observes the way they want to move. The decorative artist is nothing but a vessel according to this Cryptonaut.'
                image: 'https://ipfs.tothemoon.net/ipfs/QmU4fYk6FkwiUbUrXmBEcbSDGwHqtE8PBmDzzWXEiMpDEJ'
                gender: 'female'
              - id: c142
                label: 'Cryptonaut .142'
                description: '.142 is ready to scour the sea and observe life through his binoculars. This Cryptonaut is prepared for whatever the blue may bring and always keeps on his toes. All aboard the SS Exploration!'
                image: 'https://ipfs.tothemoon.net/ipfs/QmSco7DwviqtsBBgFuU7AmdbS6yFoQpgoTHbnRv5Vsti18'
                gender: 'male'
              - id: c143
                label: 'Cryptonaut .143'
                description: 'This lovable Cryptonaut always puts together the most elaborate, plush arrangements. It is mostly because she doesn''t use her flowers sparingly. .143 will go above and beyond and even include extra to provide the full, elegant effect.'
                image: 'https://ipfs.tothemoon.net/ipfs/QmVRXUNxx6UEj8fQniji14XtMZmG66bK4Xkpy8qPanuTSo'
                gender: 'female'
              - id: c144
                label: 'Cryptonaut .144'
                description: 'A very honest Cryptonaut who will share the true worth of every jewel. .144 is the farthest thing from a trickster who wants to rip someone off. His honesty, kindness and passion for his work has made him the number one jeweler on the moon. Planning to pop the question anytime soon?'
                image: 'https://ipfs.tothemoon.net/ipfs/QmaGnWcg1Cq6Xv9Ev28Mve8dWmw3GFJZ8KHUtV4Svpqe6g'
                gender: 'male'
              - id: c145
                label: 'Cryptonaut .145'
                description: 'Always looking for the next fossil or rune to discover, .145 is a major advocate of making the most of the land, but with the utmost respect. He is currently working to minimize the environmental impact on construction machinery used on the moon. Not to mention, this Cryptonaut is a hoot to hang with, so if you''re ever down for cleaning artifacts, you''re in for a good time.'
                image: 'https://ipfs.tothemoon.net/ipfs/QmXEGz7RcCrDFU2oX5KvvAjuWfKUcCiXtX58Cujmh9peFS'
                gender: 'male'
              - id: c146
                label: 'Cryptonaut .146'
                description: 'Want to see your colony at 10,000 ft? Just say the word and .146 will take you there. There''s no place she won''t go, regardless if it seems too far, or high. This thrillseeker simply wants to see the universe from remarkable coordinates and laugh the entire time doing it. Now you know why everyone loves her company.'
                image: 'https://ipfs.tothemoon.net/ipfs/QmZxocksjUpLRRjQoo5enHuT3Bdtk8s2DMmXMXbBukJ7NX'
                gender: 'female'
              - id: c147
                label: 'Cryptonaut .147'
                description: '"When in doubt, let your horse do the thinking." .147''s admiration and bond with horses began at a young age and hasn''t stopped growing since. When not on his horse, he''s yarnin'' the hours away at the saloon telling tales of the Old West!'
                image: 'https://ipfs.tothemoon.net/ipfs/QmQ4PH6shT4p1GbVZEr5RN942ktinBdzxbJeAsweXonfhR'
                gender: 'male'
              - id: c148
                label: 'Cryptonaut .148'
                description: 'It''s rare to find this acrobat in an upright position. But in whichever orientation you meet her, this Cryptonaut''s warm soul will always shine through. .148 is eager to share her skills and teach admirers technique.'
                image: 'https://ipfs.tothemoon.net/ipfs/QmXNry1yoAXB9wdi4BDVNunryf1jtE326MtGRwbKtAzv7m'
                gender: 'female'
              - id: c149
                label: 'Cryptonaut .149'
                description: 'The moon''s resident film buff. .149 is an easygoing Cryptonaut who enjoys sitting back and watching the classics. His extensive knowledge in cinema is what makes this Cryptonaut such a clever, quick conversationalist with brilliant references.'
                image: 'https://ipfs.tothemoon.net/ipfs/QmVP53PS1bLifA9LxBgZuKavpaCdt7h8eueRYkkKs3mXc3'
                gender: 'male'
              - id: c150
                label: 'Cryptonaut .150'
                description: 'Always hitting the double bull, there is no one more accurate than .150. It''s fascinating to witness his laser-sharp focus the moment before he throws. Just be sure to keep quiet because no one dares to disturb the billiards master.'
                image: 'https://ipfs.tothemoon.net/ipfs/Qmcw4t9UgacAZwhgzXHwhPt7NjGZNYmNAuyr4xWFSNjsfF'
                gender: 'male'
              - id: c151
                label: 'Cryptonaut .151'
                description: '.151 knows a true ruler is one who believes he is worthy to govern the group. Opinions of sheep aside, it''s time to claim the throne.'
                gender: 'male'
              - id: c152
                label: 'Cryptonaut .152'
                description: 'Ready for whatever threat is hiding around the corner, .152 is precise beyond belief. This Cryptonaut finds joy where others usually face fear- in meeting the unknown.'
                gender: 'male'
              - id: c153
                label: 'Cryptonaut .153'
                description: 'Up before some even call it a day, .153 knows that others rely on her to show up and she simply can’t let them down. A woman of her word, this Cryptonaut will never let one of her animals go astray.'
                gender: 'female'
              - id: c154
                label: 'Cryptonaut .154'
                description: 'This master of tactic is prepared to reroute at any point. .154 has the universe on his side and treats others with dignity as a way to pay it back for that.'
                gender: 'male'
              - id: c155
                label: 'Cryptonaut .155'
                description: 'An unshakeable Cryptonaut with the ability to maintain composure in the most heated of situations. .155 holds his stance and is determined to stay that way.'
                gender: 'male'
              - id: c156
                label: 'Cryptonaut .156'
                description: 'An earnest Cryptonaut, eager to keep the crowd in tears- of laughter that is! .156 is always ready for a show and his puppets are a tool to bring the group closer together.'
                gender: 'male'
              - id: c157
                label: 'Cryptonaut .157'
                description: '.157 is always working on maximizing her physical and mental potential, so rest assured she can defend the group at a moment''s notice. It’s just not recommended you sneak up on this Cryptonaut, especially while she''s drilling. Hey, she’s only human after all.'
                gender: 'female'
              - id: c158
                label: 'Cryptonaut .158'
                description: 'Only someone as controlled and on guard as .158 can handle the precision necessary to use this tool. This Cryptonaut knows what''s in his hands is anything but a toy.'
                gender: 'male'
              - id: c159
                label: 'Cryptonaut .159'
                description: 'Always able to find something worth laughing about, .159 will eagerly make do with whatever gets thrown her way. Never underestimate the jester- she is no fool.'
                gender: 'female'
              - id: c160
                label: 'Cryptonaut .160'
                description: '.160 is a skilled sorcerer who knows all the tricks to have everyone swooning. But it’s not all about wowing the group, this wiz is smart enough to use his powers for the greater good of all Cryptonauts.'
                gender: 'male'
              - id: c161
                label: 'Cryptonaut .161'
                description: 'An ancient Egyptian ruler that knows you have to be quick on your feet to wear the Nemes on your head. That’s why .161 keeps his banter game strong.'
                gender: 'male'
              - id: c162
                label: 'Cryptonaut .162'
                description: '.162 is capable of marching the distance of the moon, no problem. Along with that, this legionary can throw or thrust his spear in any direction- just say charge.'
                gender: 'male'
              - id: c163
                label: 'Cryptonaut .163'
                description: 'A leader from a great ancient dynasty, .163 does not rule with an iron fist, but instead with compassion for others and flexibility in his approach. The Mughals are known for their contribution to architecture and this Cryptonaut is no different with his help to shape the urban landscape on the moon.'
                gender: 'male'
              - id: c164
                label: 'Cryptonaut .164'
                description: 'Just like her ancestors, .164 is always asking the important philosophical questions. Her capability of higher- order thinking makes this Cryptonaut very alluring to others. Got big questions regarding our existence, this girl is always ready to talk it out.'
                gender: 'female'
              - id: c165
                label: 'Cryptonaut .165'
                description: 'Always among the first to find new land on the moon, .165 and his horned helmet are capable of handling the terrain. Adventure is always just around the corner for this Cryptonaut.'
                gender: 'male'
              - id: c166
                label: 'Cryptonaut .166'
                description: 'The inventor of futuristic agricultural practices on the moon. .166 uses his Mayan roots to better the Cryptonaut’s relationship with the land. Ethical harvesting is this Cryptonaut’s main goal.'
                gender: 'male'
              - id: c167
                label: 'Cryptonaut .167'
                description: 'A U-shaped magnet, attracting all good things, .167 is secure in himself and his ability to talk to the right people at the right time. A bit of a schmoozer, but it’s all okay when it''s for the greater good of the Cryptonauts.'
                gender: 'male'
              - id: c168
                label: 'Cryptonaut .168'
                description: 'Imagine being so creative you could see the notes before you play them. .168 can do just that. But just because she’s a musical genius doesn’t mean her mind lives far away in la la land. No, this Cryptonaut is as present and grounded as they come.'
                gender: 'female'
              - id: c169
                label: 'Cryptonaut .169'
                description: 'Doesn’t matter if skies are clear or storms roll in, .169 will make it to the other side with steady stride. If that calm confidence weren’t enough, this Cryptonaut knows how to brighten any forecast with undeniable charm.'
                gender: 'male'
              - id: c170
                label: 'Cryptonaut .170'
                description: '.170 can climb just about anything. Mountain, building, waterfall- you name it, this Cryptonaut can conquer it. Well aware of his strength, he’s ready for any challenge at a moment’s notice.'
                gender: 'male'
              - id: c171
                label: 'Cryptonaut .171'
                description: '.171 doesn’t blink when faced with a blazing, out of control fire. Tackling any problem with serenity and grace, no matter how massive, this Cryptonaut can handle it every single time and those around her rest assured knowing it.'
                gender: 'female'
              - id: c172
                label: 'Cryptonaut .172'
                description: 'The only weapon .172 will pull out is that sharp humor of his. Eager to make everyone laugh, this Cryptonaut is on duty to make sure all are having a good time.'
                gender: 'male'
              - id: c173
                label: 'Cryptonaut .173'
                description: 'Always aware of the quickest route to the destination, .173 never lets a letter arrive late. He knows the Cryptonauts depend on efficient communication, and that’s what makes this cryptonaut an honorable civil servant.'
                gender: 'male'
              - id: c174
                label: 'Cryptonaut .174'
                description: 'No one knows if it’s her serene nature, or unwavering belief that what’s meant to happen will, but .174 embraces the bull running at her with arms wide open. This Cryptonaut is ready for whatever comes charging at her.'
                gender: 'female'
              - id: c175
                label: 'Cryptonaut .175'
                description: 'Everyone is alway welcome at .175’s apiary, especially if you’re down for a good bee joke. This Cryptonaut handles the bees with grace and is in no rush to see results which is why they always make incredible amounts of honey.'
                gender: 'female'
              - id: c176
                label: 'Cryptonaut .176'
                description: 'Never one to miss the moment, you can always count on .176 to guide every arrival with perfect timing. Better yet, give this Cryptonaut a runway, and watch those signals shine the path home. A true champion of direction in every sense of the word.'
                gender: 'female'
              - id: c177
                label: 'Cryptonaut .177'
                description: 'This skillful daredevil knows he can always reach higher and learn tricks he’s never even seen. .177 is very modest considering how brilliant of a biker he is, luckily this modesty doesn’t translate to pessimism since he knows his future can only get brighter from here.'
                gender: 'male'
              - id: c178
                label: 'Cryptonaut .178'
                description: 'With moves no one has ever seen, .178 is an ingenious artist blowing everyone’s mind away. Luckily, this Cryptonaut is as unpretentious as they come. He doesn’t let the talent of his elastic body go to his head.'
                gender: 'male'
              - id: c179
                label: 'Cryptonaut .179'
                description: '.179 knows she will make it to the end of the longest tightrope and that’s much before anyone can walk the same distance. This Cryptonaut knows that being bold is the only way to accomplish her lofty goals.'
                gender: 'female'
              - id: c180
                label: 'Cryptonaut .180'
                description: '.180 knows that what he puts out into the universe will come swinging back at him, and that just doesn’t go for his boomerang. This Cryptonaut is a believer of good cosmic karma and understands that a great way to achieve that is to keep others laughing.'
                gender: 'male'
              - id: c181
                label: 'Cryptonaut .181'
                description: 'With the ability to play any tune, .181 is always open to requests. He’s eager to learn new chords and captivate the audience because this Cryptonaut can win anyone over with his unforgettable, unique sound.'
                gender: 'male'
              - id: c182
                label: 'Cryptonaut .182'
                description: '.182 is always overjoyed to share his latest tricks. He even teaches others his secrets and never holds back. This Cryptonaut is a kind yo-yo master who shares his skill with others in hopes they will enjoy the beauty of the yo-yo sport as well.'
                gender: 'male'
              - id: c183
                label: 'Cryptonaut .183'
                description: '.183 sees beautiful sights, others can’t even imagine. The magic isn’t in her binoculars, but in her mind. This creative genius is also very giving as she uses her gift to contribute to the design of the universe.'
                gender: 'female'
              - id: c184
                label: 'Cryptonaut .184'
                description: 'Always shaking to a cheerful melody, .184 is determined to be the moon’s go-to party entertainer. This Cryptonaut always brings his best to the celebration because his job is to make sure every person in the room is having the time of their lives.'
                gender: 'male'
              - id: c185
                label: 'Cryptonaut .185'
                description: 'Her spinning hula hoop mesmerizes all around .185. She then uses that fact to collect donations and give them to those in need. This Cryptonaut is as benevolent as they come.'
                gender: 'female'
              - id: c186
                label: 'Cryptonaut .186'
                description: 'A master builder, .186 lets intelligence reign. He uses his blocks to depict a modern perspective only he can see and doesn’t ask for anything in return. This Cryptonaut is simply happy to be a brick in the final product that is TTM’s future.'
                gender: 'male'
              - id: c187
                label: 'Cryptonaut .187'
                description: 'This social butterfly doesn’t need wings, she has a propeller cap that takes her from friend group to friend group. Everyone loves .187 due to her giving, compassionate spirit.'
                gender: 'female'
              - id: c188
                label: 'Cryptonaut .188'
                description: 'Known as the “kingpin”, .188 is known to hit the center pin every time, and he makes solid strikes doing it! We’re not just talking about fallen pins- this Cryptonaut’s jokes take everyone out with a single roll.'
                gender: 'male'
              - id: c189
                label: 'Cryptonaut .189'
                description: '.189 always knows the smoothest way from point A to B and is ready for the next run. Known for staying aware of every move around her and never missing the right moment to act, this dependable Cryptonaut rides every path with confidence and control.'
                gender: 'female'
              - id: c190
                label: 'Cryptonaut .190'
                description: 'There’s no point in even trying an extreme sport like fire dancing if you aren’t sure of your capabilities. .190 knows that and is ready to manipulate the flames into any form as he takes his work very seriously. Thank goodness for that because not everyone can handle this heat.'
                gender: 'male'
              - id: c191
                label: 'Cryptonaut .191'
                description: 'Always around to offer a gentle breeze, .191 is a kind soul who’s charity is her trademark. This Cryptonaut always knows the right thing to do and is not afraid to share this insight with others.'
                gender: 'female'
              - id: c192
                label: 'Cryptonaut .192'
                description: 'Always keeping it light with his incredible slinky tricks, .192 is a true artist but will never admit it. This Cryptonaut knows that the real fun is amongst the “amateurs” even though his skill is far beyond that level.'
                gender: 'male'
              - id: c193
                label: 'Cryptonaut .193'
                description: 'This yogee understands that his practice is an exploration of all that his body is capable of and .193 is able to do it all. Known as the pretzel, this cryptonaut can move in magnificent ways.'
                gender: 'male'
              - id: c194
                label: 'Cryptonaut .194'
                description: 'Somehow, all the pieces just fit together with .194. This Cryptonaut is always looking for the quickest way to see the bigger picture. Her intelligence allows her to work backwards from confusing problems to arrive at a simple solution.'
                gender: 'female'
              - id: c195
                label: 'Cryptonaut .195'
                description: 'Definitely the loudest of the crowd, .195 is dedicated to supporting those around him, which is what makes him so admired and loved. Nothing can stop this Cryptonaut from being not only a fan, but a true team player.'
                gender: 'male'
              - id: c196
                label: 'Cryptonaut .196'
                description: '.196 trusts his gut when it comes to most things in life and horse jockeying is no different. The fastest racer any planet has ever seen, this Cryptonaut has a gift of pace and keeping hope alive, even when far behind the rest.'
                gender: 'male'
              - id: c197
                label: 'Cryptonaut .197'
                description: 'Lights, camera, action! .197 is the movie star everyone loves to watch, regardless of the fact his camera is always rolling. This Cryptonaut loves to capture the magnificent sights of the moon and everyone loves him for it.'
                gender: 'male'
              - id: c198
                label: 'Cryptonaut .198'
                description: '.198’s unwavering belief in the goodness of all Cryptonauts is as unbreakable as the chains in his hands. This Cryptonaut is also a master at setting up contraptions that lift and transfer power, making him crucial to the moon’s development.'
                gender: 'male'
              - id: c199
                label: 'Cryptonaut .199'
                description: 'With a knack for geography (of every planet), .199 uses her smarts and instincts to map out ideal travel routes for all. Not only that, she can pinpoint unexplored locations, making her part of the first step when it comes to discovering unchartered territory.'
                gender: 'female'
              - id: c200
                label: 'Cryptonaut .200'
                description: '.200 sees how any situation will play out well before it does. With his creative visions, this Cryptonaut directs the group’s way to overcome obstacles. After all, what good story doesn’t have its setbacks? That is of course if the protagonist wins in the end and .200 makes sure of it.'
                gender: 'male'
          - id: buildings_cryptonaut
            label: 'Buildings'
            icon: 'category_buildings'
            children:
              - id: moon_tower
                label: 'Moon Tower'
                icon: 'category_moon_tower'
                children:
                  - id: moon_tower_t1
                    label: 'T1'
                  - id: moon_tower_t2
                    label: 'T2'
                  - id: moon_tower_t3
                    label: 'T3'
              - id: greenhouse
                label: 'Greenhouse'
                description: 'A place of transformation. This is where the Moon Seeds blossom into lush plants when provided with a sufficient amount of water. Plants are fuel to Cryptonauts and Creatures. With areas of both exposure and shelter for all types of plants, Greenhouses are the key for communities to flourish and prosper on the moon.'
                image: 'https://ipfs.tothemoon.net/ipfs/QmQPPAGiPzpEXmKjSkWaQJXkYQ9MEY8MMmWW7oNHVtkLPs'
              - id: creature_lab
                label: 'Creature Lab'
                description: 'A home away from home for the majestic Moon Creatures on the Cryptonaut’s side of the moon. The facility holds any and all of the specifics needed for each breed. From all season terrains to grooming necessities; feed, train and bond with the community’s fun-loving friends.'
                image: 'https://ipfs.tothemoon.net/ipfs/QmTLsKBcASHurGkqaZuvQJzjjeFF37DeDS7oawjp7CAFmC'
              - id: headquarters
                label: 'Main Base'
                description: 'A moon mansion that would make the top of every Explorer’s “Must-Stay” list. The bases are designed to house the Cryptonauts. Found on every moon plot, Moon Bases provide housing for up to 10 Cryptonauts, but rest assured, there’s still plenty of space for each roomie.'
                image: 'https://ipfs.tothemoon.net/ipfs/QmS618oCH3kv8ThTivYLkREWzCzdk9r3nCyknvoLmBrUi5'
              - id: mining_facility
                label: 'Mine'
                description: 'The start of any successful Moon Team’s building plan. This infrastructure is a well-oiled machine running on Lithium Moon Rocks, as it maintains the economic system of TOTHEMOON UNIVERSE.'
                image: 'https://ipfs.tothemoon.net/ipfs/QmVoqyLghYsw5PVSr7kyfYeyA9Bt575pdJLdjeHeuapETX'
              - id: observatory
                label: 'Star Tower'
                description: 'The "EYE" of the moon. Aside from a stunning view, this high ground allows for the teams to explore the universe by telescope and expand their maps. Maybe a cryptonaut will be lucky enough to catch a glimpse of a Comet Drop!'
                image: 'https://ipfs.tothemoon.net/ipfs/QmTW7NysZD859tWLHXspfW7jixd8ym5Dd6ETgHM4FKFaDw'
              - id: communication_tower
                label: 'Radio Tower'
                description: 'No dropped calls here. Signal is strengthened as these towers offer a greater radius of communication on the moon. With cell service this good, teams are able to quickly and easily connect with each other.'
                image: 'https://ipfs.tothemoon.net/ipfs/QmQ6azwuataEd2qVBSzj7WsX7tSN2ip3V3viXpZFhGSBcJ'
              - id: gravity_zone
                label: 'Gravity Zone'
                description: 'Stronger. Faster. Gravity Zones are where teams train to increase their speed. This helps them cover more ground and make the most of each expedition to the "Dark Side of the Moon". This infrastructure acts as a gym for the community. Go hard or go home.'
                image: 'https://ipfs.tothemoon.net/ipfs/QmekR3it1c9ppGzoRDYT7vreept2ED5DSMMUzj3AjjEFoy'
              - id: research_lab
                label: 'Science Lab'
                description: 'A good Cryptonaut holds the thirst for knowledge and understands the importance of the advice, “never stop learning”. Research Labs are where these explorers go to expand their minds. By doing so, they are prepared for the journey to the “Dark Side of the Moon” and have the skills necessary to view and analyze other Moon Teams’ Observatories.'
                image: 'https://ipfs.tothemoon.net/ipfs/QmUdf5g4ykzYiyyZAwWVSZCb8iibw41yiVX1TMdhjA2GV8'
              - id: building_utilities
                label: 'Utilities'
                icon: 'category_building_utilities'
                children:
                  - id: reservoir
                    label: 'Water Store'
                    description: 'This is not your average rural village well. Hundreds of litres of water are drilled each day and not a drop is wasted. Fresh water is essential for all walks of life and this sustainable facility supports that notion.'
                    image: 'https://ipfs.tothemoon.net/ipfs/QmeNMfN8r62JzCnszdjbr8HygC11b1a1Zodr1VSRptb7gR'
                  - id: gas_station
                    label: 'Gas Station'
                    description: 'The refuel centre. With three discharge stations, the Gas Station is where Cryptonauts get GAS- fuel of the economy. Only the most hardworking Cryptonauts dedicate their working hours to this infrastructure; the process of retrieving GAS from the caves and transporting it to stations can be extremely strenuous.'
                    image: 'https://ipfs.tothemoon.net/ipfs/QmaMZWCV2LiYgHXJLbtsofSiycygCcixQRyy7b7CSdrA3A'
                  - id: power_plant
                    label: 'Power Plant'
                    description: 'The brightest light on this side of the moon. Constantly charged and buzzing, the Electricity Plant supports the function of all community-made infrastructures. This voltaic epicentre runs on Electrical Mushrooms.'
                    image: 'https://ipfs.tothemoon.net/ipfs/QmNSFynXhfnTAHjk94ppZS8Hxk5dhRx7Jcqg2uFFbC9kx7'
                  - id: oxygen_center
                    label: 'Oxygen Center'
                    description: 'It’s tough being a human on the moon…needing oxygen and all. The Oxygen Tanks make movement on the “Dark Side of the Moon” possible, and the centres increase their efficiency. This is most useful for travel and exploration, so be sure to pay a visit. Your tank will thank you for it.'
                    image: 'https://ipfs.tothemoon.net/ipfs/QmQi2Swcdkr3maMLCuikh5WfZBGCZLc11ySpSjA1zT2RRs'
          - id: items
            label: 'Items'
            icon: 'category_items'
            children:
              - id: iwj_1
                label: 'Water Jug'
                description: 'With additional hidden compartments, this small but mighty container can hold a lot more than you''d think. It is compact enough to keep the water''s temperature optimal for consumption by plants, creatures and Cryptonauts alike.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/misc/Water_Jug.png'
              - id: iot_23
                label: 'Oxygen Tank'
                description: 'This tank is designed to help Cryptonauts learn to increase their natural oxygen levels, so that they are ready to make the venture to the other side of the moon. Its purpose is for use within the Oxygen Centres.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/misc/Oxygen_Tank.png'
              - id: transport_items
                label: 'Carry Gear'
                icon: 'category_transport'
                children:
                  - id: ifb_24
                    label: 'Food Box'
                    description: 'Made with extremely durable material- space foam and plastic, this Food Box is designed for transporting food of any temperature. It''s sleek, solid and impermeable to prevent any messes on the moon.'
                    image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/misc/Food_Box.png'
                  - id: isfb_25
                    label: 'Special Food Box'
                    description: 'The Moon Creatures require Special Food and Special Food requires a Special Box. This trusty capsule is far from your mom''s Tupperware, as it''s specifically engineered to maintain the food''s rare, holistic qualities.'
                    image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/misc/Special_Food_Box.png'
                  - id: iwb_26
                    label: 'Wheelbarrow'
                    description: 'Designed with an even weight distribution, this Wheelbarrow is just as easy to manoeuvre when filled to the brim with Gas, as when empty. The use of a lightweight space plastic also contributes to this wonderbarrow''s effectiveness.'
                    image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/misc/Wheelbarrow.png'
                  - id: imc_27
                    label: 'Mining Cart'
                    description: 'This fancy, advanced wagon transports the Lithium Moon Rocks. It is small enough to take up the mountains and large enough to hold a substantial amount of the special metal.'
                    image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/misc/Mining_Cart.png'
                  - id: isb_28
                    label: 'Special Basket'
                    description: 'The Special Basket is used to transport the electrical mushrooms. It is made of a non-conductive material that will maintain the needed energy of its contents.'
                    image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/misc/Special_Basket.png'
                  - id: isg_29
                    label: 'Special Gloves'
                    description: 'These Special Gloves allow for the preservation of the fossil''s natural state through the prevention of disintegration. Fossils are delicate and the more intact they are when reaching the Research Labs, the better, which is why these particular gloves are essential when it comes to handling them.'
                    image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/tools/Special_Gloves.png'
                  - id: isbg_30
                    label: 'Special Bag'
                    description: 'This rare bag is designed specifically to transport raw moon stones to the Oxygen Centres. The magic is safeguarded due to the bag''s special material: space canvas. Space canvas appears much more solid than earth canvas but because of the space cotton and other synthetic fabrics, this bag resembles more of a jet pack, than common transportation gear.'
                    image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/misc/Special_Bag.png'
              - id: entry_items
                label: 'Entry'
                icon: 'category_entry'
                children:
                  - id: imt_67
                    label: 'Moon Ticket'
                    description: 'The Moon ticket grants access to Concert Hall for exciting events and concerts. It''s time to let the good times roll.'
                    image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/misc/Moon_Ticket.png'
                  - id: isac_68
                    label: 'Special Access Card'
                    description: 'The holder of this card is part of an exclusive club. Definitely an item worth having, if at least not for the mystery of it all.'
                    image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/misc/Special_Access_Card.png'
              - id: imsc_69
                label: 'Moon Scroll'
                description: 'The Moon Scroll is a rare item that gives its owner advantage on The Dark Side of The Moon. It contains the Moon Code, which represents the beginnings of the relationship between the Cryptonauts and Moon Babies. It is the gold standard of behaviour as one accepts the responsibility to live and grow on the moon.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/misc/Moon_Scroll.png'
              - id: md_999
                label: 'Moon Device'
                description: 'This device unlocks the greatest opportunities of the universe.'
          - id: resources
            label: 'Materials'
            icon: 'category_resources'
            children:
              - id: ig_70
                label: 'Gas'
                description: 'This black sand is found in the caves and is essential to all operations of the moon. Its texture is strange- soft and moist, yet leaves no liquid on the skin. Scientists have studied the mineral but have yet to explain this unique quality. Its colour is deep and rich but never runs, even when mixed with water.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/resources/Gas.png'
              - id: ism_71
                label: 'Straight Mushroom'
                description: 'This mushroom is fully charged and ready to expel its energy through Watts. Comparable to the strongest battery on earth, the Straight Mushroom is found deep in craters, lighting up the darkest corners.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/resources/Straight_Mushroom.png'
              - id: icm_72
                label: 'Curved Mushroom'
                description: 'Powerful and pink, this electrical mushroom is found in craters and produces enough Watts to illuminate the entire Dark Side. Only problem is, Cryptonauts have not yet figured out how to utilize this shroom to its full potential and can only extract a certain amount of Watts. This mushroom produces the highest amount of Watts regardless of the Cryptonaut''s limited knowledge of it.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/resources/Curved_Mushroom.png'
              - id: ilmr_73
                label: 'Lithium Rock'
                description: 'This special rock is found high up in the mountains. Though it is not common to see, it is easy to spot due to its neon green color. This rock produces Lithium, the alkali metal used for powering some of the most important Infrastructures on the moon.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/resources/Lithium_Moon_Rock.png'
              - id: imf1_74
                label: 'Fossil 1'
                description: 'With the skeleton of what appears to be an extinct bird-like Moon Creature, Moon Fossil 1 is found deep in the ground, just outside the forest areas. As each discovery allows for Cryptonauts to further connect the dots of the past.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/resources/Moon_Fossil_1.png'
              - id: imf2_75
                label: 'Fossil 2'
                description: 'Also found just outside of the forest area, Moon Fossil 2 looks like the remains of a type of water creature. Archaeologists have tried to understand how these fossils have ended up deep in the ground, away from water and speculate a lake where we now have land. This fossil reminds Cryptonauts of a time before them. What is now, was not always so.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/resources/Moon_Fossil_2.png'
              - id: irms_76
                label: 'Raw Stone'
                description: 'The breath-taking Raw Moon Stone is found on the outer edges of the craters. These Stones produce magic and gift its finders with an aura that attracts great fortunes and incredible opportunities going forward.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/resources/Raw_Moon_Stone.png'
              - id: ims_77
                label: 'Stone'
                description: 'Once refined at the Oxygen Centers, a beautiful spectrum of purple to pink is revealed on the rock. The stunning stone produces the highest amount of magic for those who understand how to utilize it.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/resources/Moon_Stone.png'
              - id: moon_seeds
                label: 'Seeds'
                icon: 'category_moon_seeds'
                children:
                  - id: imss_11
                    label: 'Strawberry'
                    description: 'This heart-shaped kernel has the potential to grow a plant that will produce up to five quarts of Moon Strawberries a season. Pretty impressive for the moon''s smallest seed.'
                    image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/resources/Moon_Strawberry_Seed.png'
                  - id: imrs_12
                    label: 'Raspberry'
                    description: 'With a watermelon-like appearance, the Moon Raspberry Seed produces the moon''s sweetest fruit. The seeds themselves can be enjoyed, but it is only for those with a serious sweet tooth. Wow, a seed sweeter than candy…only on the moon!'
                    image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/resources/Moon_Raspberry_Seed.png'
                  - id: imps_13
                    label: 'Pear'
                    description: 'This seed may produce the most nutrient-dense fruit in the universe; however, the seed itself is poisonous and extremely harmful to all living things. This is why this pretty little thing must be handled with caution.'
                    image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/resources/Moon_Pear_Seed.png'
                  - id: imas_14
                    label: 'Apple'
                    description: 'It''s hard to tell that this tiny seed will eventually grow into a stunning Pyramidal tree. The bright red shell hides its potential, but eventually, its stunning blue soul sprouts through and flourishes.'
                    image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/resources/Moon_Apple_Seed.png'
              - id: special_moon_seeds
                label: 'Special Seeds'
                icon: 'category_special_moon_seeds'
                children:
                  - id: ismbs_15
                    label: 'Special Berry'
                    description: 'Looking like a rare gem, the Special Moon Berry Seed offers the pungent taste of a typical berry and a smell like no other. Its distinct odour can only be tamed with salt.'
                    image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/resources/Special_Moon_Berry_Seed.png'
                  - id: ismps_16
                    label: 'Special Plant'
                    description: 'This is not like any other seed. This seed brings its planter good luck. Legend has it that the universe rewards those who take care of the ecosystem and since this plant offers the most nourishment to the creatures, the planter reaps what they sow in more ways than one.'
                    image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/resources/Special_Moon_Plant_Seed.png'
              - id: moon_fossil_3
                label: 'Abyss Fossil'
          - id: cryptonaut_suits
            label: 'Suits'
            icon: 'category_suits'
            children:
              - id: cryptonaut_suit_00
                label: 'Nova Basic'
                description: 'The Nova-Class Standard Suit is the most widely used EVA platform in lunar settlements. Developed by the Nova Consortium after the third lunar industrial expansion, it balances mobility, radiation protection, and manufacturability. Its modular plating and simplified life-support systems allow easy maintenance and repair. Perk: Highly reliable and easy to manufacture. Flaw: Lacks specialized protection for extreme environments. Status: Current production.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/suits/00.png'
              - id: cryptonaut_suit_01
                label: 'Nova Builder'
                description: 'The Engineering variant of the Nova suit is built for maintenance, construction, and hull repair work. It adds reinforced gloves, magnetic boot stabilizers, and integrated tool mounts to the base design. These upgrades improve durability and utility but make the suit heavier and slightly less agile. Perk: Reinforced joints and integrated tool mounts. Flaw: Heavier and less agile than the standard Nova suit. Status: Widely used by engineering crews.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/suits/01.png'
              - id: cryptonaut_suit_02
                label: 'Ares'
                description: 'Designed for brutal regolith excavation conditions, the Ares suit used reinforced joints and thick plating to protect workers from debris and micrometeor impacts. The rigid structure provided durability but severely limited agility and consumed large amounts of power. Perk: Exceptional impact resistance. Flaw: Extremely heavy and slow. Status: Phased out after mining automation increased.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/suits/02.png'
              - id: cryptonaut_suit_08
                label: 'Frontier'
                description: 'The Frontier suit was produced cheaply and designed to be repaired with minimal tools. Prospectors and freelancers favored it for its simplicity, despite its limited environmental protection. Perk: Cheap and easily repairable. Flaw: Weak radiation shielding. Status: Still common among private prospectors.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/suits/08.png'
              - id: cryptonaut_suit_11
                label: 'Atlas'
                description: 'Atlas suits were essentially wearable exoskeletons built to assist workers assembling early lunar megastructures. The suit could lift heavy machinery but consumed enormous power and required frequent maintenance. Perk: Extreme lifting strength. Flaw: High power consumption. Status: Replaced by robotic loaders.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/suits/11.png'
              - id: cryptonaut_suit_19
                label: 'Unity'
                description: 'The Unity suit was intended to standardize EVA technology across multiple space agencies. While technically impressive, political disagreements halted its widespread adoption. Perk: Highly modular design. Flaw: Complex maintenance. Status: Abandoned program.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/suits/19.png'
              - id: cryptonaut_suit_22
                label: 'Aqua'
                description: 'Aqua suits were engineered to operate within extremely cold crater environments where frozen water deposits were harvested for colony supply. Perk: Superior cold resistance. Flaw: Poor heat dissipation. Status: Limited industrial deployment.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/suits/22.png'
              - id: cryptonaut_suit_24
                label: 'Drift'
                description: 'Salvagers used Drift suits to recover abandoned satellites and debris orbiting the Moon. Magnetic boots and tether systems were standard features. Perk: Excellent zero-g maneuverability. Flaw: Weak surface protection. Status: Still used by salvage guilds.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/suits/24.png'
              - id: cryptonaut_suit_25
                label: 'Genesis'
                description: 'The Genesis suit marked the beginning of permanent lunar habitation. Its life-support systems were robust but bulky, making it inefficient compared to modern designs. Perk: Extremely durable life-support. Flaw: Obsolete and inefficient. Status: Historical artifact.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/suits/25.png'
              - id: cryptonaut_suit_03
                label: 'Helios'
                description: 'Helios suits were issued to geological survey teams responsible for mapping the lunar surface during the expansion era. Their bright coloration helped drone observers and orbiting satellites track explorers against the monochrome terrain. Perk: Advanced terrain scanners. Flaw: Limited radiation protection. Status: Retired once orbital mapping replaced ground surveys.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/suits/03.png'
              - id: cryptonaut_suit_04
                label: 'Pioneer'
                description: 'Pioneer suits allowed explorers to travel long distances across the lunar surface with reduced fatigue. The suit emphasized flexibility and endurance systems but sacrificed durability to achieve its low weight. Perk: High mobility and endurance. Flaw: Fragile shell structure. Status: Rare collector’s suit among exploration guilds.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/suits/04.png'
              - id: cryptonaut_suit_05
                label: 'Triton'
                description: 'Triton suits used servo-assisted joints and dynamic balance systems to dramatically increase movement efficiency. However, lunar dust infiltration repeatedly damaged the delicate mechanics, making the system unreliable in real missions. Perk: Exceptional movement agility. Flaw: Mechanical reliability issues. Status: Prototype program cancelled.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/suits/05.png'
              - id: cryptonaut_suit_09
                label: 'Horizon'
                description: 'Horizon suits integrated instrument ports allowing scientists to plug sensors, analyzers, and research equipment directly into the suit’s onboard systems. Perk: Integrated research instrumentation. Flaw: Delicate external mounts. Status: Mostly replaced by drone-assisted research.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/suits/09.png'
              - id: cryptonaut_suit_10
                label: 'Pathfinder'
                description: 'Pathfinder suits helped small survey teams quickly evaluate new base locations. Advanced scanning packages were included but oxygen capacity was limited. Perk: Advanced scanning systems. Flaw: Short EVA duration. Status: Replaced by automated reconnaissance drones.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/suits/10.png'
              - id: cryptonaut_suit_12
                label: 'Mercury'
                description: 'The Mercury suit provided emergency EVA capability while remaining comfortable enough for cockpit use. It lacked rugged surface protection but worked well for short-duration operations around spacecraft. Perk: Lightweight and ergonomic. Flaw: Poor surface durability. Status: Still used by cargo pilots.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/suits/12.png'
              - id: cryptonaut_suit_15
                label: 'Solar'
                description: 'Built for missions near permanently illuminated lunar peaks, the Solar Expedition suit incorporated layered radiation shielding to protect workers from constant solar exposure. Perk: Excellent radiation shielding. Flaw: Bulky and thermally inefficient. Status: Rare outside solar observatories.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/suits/15.png'
              - id: cryptonaut_suit_16
                label: 'Ranger'
                description: 'Ranger suits stripped away non-essential systems to maximize endurance and efficiency. They were used by scouting teams covering large distances. Perk: High stamina efficiency. Flaw: Minimal armor protection. Status: Replaced by rover scouting drones.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/suits/16.png'
              - id: cryptonaut_suit_17
                label: 'Aurora'
                description: 'Aurora suits prioritized comfort and aesthetic appeal for commercial lunar excursions. Their safety systems were sufficient for controlled environments but not for industrial missions. Perk: Comfortable and user-friendly. Flaw: Low durability. Status: Used only in tourism programs.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/suits/17.png'
              - id: cryptonaut_suit_23
                label: 'Comet'
                description: 'Comet pilots required flexible suits allowing precise maneuvering while operating capture equipment around icy asteroid fragments. Perk: Advanced maneuvering controls. Flaw: Minimal armor. Status: Rare specialist equipment.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/suits/23.png'
              - id: cryptonaut_suit_06
                label: 'Eclipse'
                description: 'The Eclipse suit minimized reflective surfaces and thermal signatures, making it ideal for surveillance or security missions near sensitive installations. The specialized coatings degraded quickly under prolonged solar exposure. Perk: Reduced sensor detection. Flaw: Expensive maintenance. Status: Restricted security surplus.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/suits/06.png'
              - id: cryptonaut_suit_07
                label: 'Apollo'
                description: 'Designed to commemorate humanity’s first steps on the Moon, the Apollo Heritage suit replicates many visual elements of the original historical suits while quietly incorporating modern life support technology. Perk: Extremely reliable life-support. Flaw: Limited flexibility. Status: Used primarily for ceremonial or tourism missions.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/suits/07.png'
              - id: cryptonaut_suit_13
                label: 'Sentinel'
                description: 'Sentinel suits featured reinforced armor plates and advanced communication systems allowing security teams to patrol installations safely. Perk: Enhanced armor protection. Flaw: Reduced agility. Status: Rare after widespread security automation.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/suits/13.png'
              - id: cryptonaut_suit_14
                label: 'TerraGreen'
                description: 'TerraGreen suits protected lunar ecosystems from contamination while allowing workers to maintain agricultural domes and biological experiments. Perk: Bio-safe filtration systems. Flaw: Weak vacuum protection. Status: Used only inside controlled environments.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/suits/14.png'
              - id: cryptonaut_suit_18
                label: 'Vanguard'
                description: 'The Vanguard suit integrated tactical communications and reinforced armor. However, international treaties later demilitarized most lunar operations, making the suit unnecessary. Perk: Heavy armor protection. Flaw: Extremely costly and heavy. Status: Classified historical equipment.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/suits/18.png'
              - id: cryptonaut_suit_20
                label: 'Nebula'
                description: 'Nebula suits experimented with flexible materials that dramatically improved mobility. Production costs were far too high for mass deployment. Perk: Exceptional flexibility. Flaw: Prohibitively expensive. Status: Experimental archive.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/suits/20.png'
              - id: cryptonaut_suit_21
                label: 'Archivist'
                description: 'Archivist suits recorded large amounts of environmental and structural data while exploring abandoned lunar installations and early settlements. Perk: Large onboard data storage. Flaw: Reduced mobility. Status: Used by research expeditions.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/suits/21.png'
      - id: trainers
        label: 'Trainers'
        icon: 'trainer'
        weight: 2
        children:
          - id: trainer_gin
            label: 'GIN'
            image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/trainers/GIN.png'
            description: 'A true teacher at heart. GIN is the trailblazer whose bravery is anchored to his sound judgment and kindness.'
            weight: 1
            gender: 'male'
          - id: trainer_jax
            label: 'JAX'
            image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/trainers/JAX.png'
            description: 'The entire universe is working in his favour and he knows it. His good things will come attitude makes JAX a man of ease and composure in any situation.'
            weight: 1
            gender: 'male'
          - id: trainer_pxl
            label: 'PXL'
            image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/trainers/PXL.png'
            description: 'It''s easy to go with the flow and maintain child-like wonder with an unwavering belief like PXL''s. Of course, a playful, can-do attitude is part of this package, but her most striking trait is her insurmountable fearlessness.'
            weight: 1
            gender: 'female'
          - id: trainer_rev
            label: 'REV'
            image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/trainers/REV.png'
            description: 'Good things come to those who wait and REV feels this deep in her bones. Her charisma and nobleness make her a magnet to those around her.'
            weight: 1
            gender: 'female'
          - id: trainer_axl
            label: 'AXL'
            image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/trainers/AXL.png'
            description: 'There is a time to wait, and a time to create, and AXL always knows what’s the time for what. His kindness and humor make him a valued member of the Moon Trainer team as he always keeps the gang in good spirits.'
            weight: 1
            gender: 'male'
          - id: trainer_dev
            label: 'DEV'
            image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/trainers/DEV.png'
            description: 'Never afraid to grab the bull by the horns, DEV and his wild hair will charm his way into your heart. A smart guy who doesn’t only depend on that, but is also determined and ready for whatever.'
            weight: 1
            gender: 'male'
          - id: trainer_lin
            label: 'LIN'
            image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/trainers/LIN.png'
            description: 'LIN knows that where the attention goes, energy flows. That’s why she is always counting her blessings, then watching them multiply. A talented trainer with natural technique, LIN is one smart moon cookie.'
            weight: 1
            gender: 'female'
          - id: trainer_rax
            label: 'RAX'
            image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/trainers/RAX.png'
            description: 'With a strong presence, RAX is not afraid to take charge when needed. She is the group''s go-to with her agile, practical approach to life and can-do attitude.'
            weight: 1
            gender: 'female'
          - id: trainer_izi
            label: 'IZI'
            image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/trainers/IZI.png'
            description: 'IZI definitely gives more than she gets, but that doesn’t mean she’s ever at a loss- it’s just literally impossible to match her kindness. The universe sees this and acts accordingly as it constantly sends delightful surprises her way.'
            weight: 1
            gender: 'female'
          - id: trainer_kye
            label: 'KYE'
            image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/trainers/KYE.png'
            description: 'KYE will still be waiting, long after the last grain falls through the hourglass. With incredible persistence, this trainer doesn’t know how to throw in the towel. The going is never tough enough for her.'
            weight: 1
            gender: 'female'
          - id: trainer_wun
            label: 'WUN'
            image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/trainers/WUN.png'
            description: 'When it comes to WUN, four eyes means just that- four eyes. This trainer carries the ability to spot and adapt to all happenings. Aside from his intellectual appearance, WUN is also a true jokester underneath.'
            weight: 1
            gender: 'male'
          - id: trainer_zen
            label: 'ZEN'
            image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/trainers/ZEN.png'
            description: 'Running water. ZEN is the peaceful force that relieves those around him and creates a state of complete serenity. At the same time, he is able to break through the dam blocking the forward motion of the group. On earth and space, not much can compete with the strength of water.'
            weight: 1
            gender: 'male'
          - id: trainer_key
            label: 'KEY'
            image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/trainers/KEY.png'
            description: 'KEY''s brain is in overdrive all the time, but never burns out! There''s always a light on at home with this trainer. Just try to keep up with his banter. He won''t stop till he has learned all there is to know about this universe!'
            gender: 'male'
          - id: trainer_uzi
            label: 'UZI'
            image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/trainers/UZI.png'
            description: 'Confident and ready to run the day, UZI is a smooth talker who likes to win. He knows that with a sunny outlook and suave way, nothing is impossible. Look out!'
            gender: 'male'
          - id: trainer_wyn
            label: 'WYN'
            image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/trainers/WYN.png'
            description: 'WYN''s in no rush to blaze the trail. She knows what''s truly hers for the taking will be there when she arrives- all in good time. Besides, racing from place to place leaves no time for laughter and that''s something she can''t go without.'
            gender: 'female'
          - id: trainer_zin
            label: 'ZIN'
            image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/trainers/ZIN.png'
            description: 'ZIN has every skill that the terrain requires. She regularly shows Cryptonauts how to do the same for nothing in return. She sees it as a way to pay homage to the moon for being the most beautiful and giving landscape to all.'
            gender: 'female'
      - id: vehicles
        label: 'Vehicles'
        icon: 'vehicle'
        weight: 4
        children:
          - id: vehicles_travel
            label: 'Travel'
            icon: 'category_vehicles_travel'
            children:
              - id: moon_buggy
                label: 'Moon Buggy'
              - id: race_car
                label: 'Race Car'
                description: 'Vroom vroom. This vehicle can be upgraded/modified to increase Speed, Acceleration, and Control. The rear spoiler majorly reduces drag and provides more grip, even when approaching those crazy speeds. With a powerful engine and traction in the tires, this car is ready to run.'
              - id: hover_craft
                label: 'Hover Craft'
                description: 'With its sleek, aerodynamic design, the Hovercraft can pierce through the wind with its airfoil composition and low drag shape. It can be upgraded and modified to increase Speed, Acceleration, and Control.'
              - id: rover
                label: 'Rover'
                icon: 'category_rover'
                weight: 3
                children:
                  - id: rover_light
                    label: 'Light Rover'
                    description: '[example] A compact surface rover for scouting routes and carrying a small field kit.'
                    weight: 2
                  - id: rover_heavy
                    label: 'Heavy Rover'
                    description: '[example] A heavy surface rover for transporting equipment and supplies across rough terrain.'
                    weight: 1
              - id: shuttle
                label: 'Shuttle'
                icon: 'category_shuttle'
                weight: 2
                children:
                  - id: shuttle_cargo
                    label: 'Cargo Shuttle'
                    description: '[example] A transport shuttle for moving supplies, equipment, and vehicles between landing sites.'
                    weight: 2
                  - id: shuttle_scout
                    label: 'Scout Shuttle'
                    description: '[example] A light shuttle for surveying terrain and locating suitable landing sites.'
                    weight: 1
              - id: bike
                label: 'Bike'
                description: '[example] A single-rider surface bike for travelling light between nearby destinations.'
                weight: 1
          - id: vehicles_construction
            label: 'Construction'
            icon: 'category_vehicles_construction'
            children:
              - id: scissor_lift
                label: 'Scissor Lift'
                description: 'Made to reach heights beyond the view from its base, the scissor lift is a quick way to get those hard to reach places and build vertical.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/vehicles/Scissor_Lift.png'
              - id: forklift
                label: 'Forklift'
                description: 'This lightweight champion of a forklift can hold up to nearly 100,000 lbs! This is crucial when it comes to transporting material to build.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/vehicles/Forklift.png'
              - id: backhoe
                label: 'Backhoe'
                description: 'This rear actor is the ultimate excavating machine. Offering ultimate power and precision, this vehicle will be a necessity when it comes to construction, demolition, landscaping and breaking through the hardest services of the moon.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/vehicles/Backhoe.png'
              - id: cement_mixer
                label: 'Cement Mixer'
                description: 'Producing enough concrete for a metropolitan oasis, this mixer has a motor wattage of 3000. Flawlessly incorporating water and mix in a short period of time, this machine produces the most effective, smoothest concrete.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/vehicles/Cement_Mixer.png'
              - id: dump_truck
                label: 'Dump Truck'
                description: 'Crack proof and rust proof- this dump truck helps transport construction materials, waste and just about anything that needs to get from A to B safe and secured.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/vehicles/Dump_Truck.png'
              - id: wheeled_crane
                label: 'Wheeled Crane'
                description: 'The Wheeled Crane can lift up to 18 tons- that''s about five Moon Elephants! This baby also has the ability to move a full 360 degrees offering complete range of motion.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/vehicles/Wheeled_Crane.png'
              - id: hydraulic_crane
                label: 'Hydraulic Crane'
                description: 'Due to its internal hydraulic system, this crane can hold up to 50 tons! In comparison to the solid Wheeled Crane, that is about 12 and a half Moon Elephants, which more than doubles its weight capability.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/vehicles/Hydraulic_crane.png'
              - id: iex_43
                label: 'Excavator'
                description: 'This tank-like crawler is ideal for the uneven terrain of the moon. Its compact look and use of hydraulic power offer stability on tricky surfaces.'
                image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/vehicles/Excavator.png'
          - id: vehicles_combat
            label: 'Combat'
            icon: 'category_vehicles_combat'
            children:
              - id: king_apc
                label: 'King APC'
              - id: goliath
                label: 'Goliath'
          - id: vehicle_parts
            label: 'Parts'
            icon: 'category_vehicle_parts'
            children:
              - id: hovercraft_parts
                label: 'Hovercraft'
                icon: 'category_hovercraft_parts'
                children:
                  - id: ihcbw_48
                    label: 'Balanced Wheel'
                    description: 'The HC Balanced Wheel is a wheel modification that offers greater Control of a Hovercraft, while increasing Speed and Acceleration. All in all, this is the most comprehensive modification offered.'
                    image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/parts/HC_Balanced_Wheel.png'
                  - id: ihcsw_49
                    label: 'Standard Wheel'
                    description: 'The HC Standard Wheel modification is aimed towards increasing Control of the Hovercraft, but unfortunately increases Acceleration time. The grip on this wheel is also worth noting as the space leather is perfect for all terrain driving control.'
                    image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/parts/HC_Standard_Wheel.png'
                  - id: ihcew_50
                    label: 'Expert Wheel'
                    description: 'The Expert Wheel modification is fully specialized to increase Control, but greatly diminishes the Acceleration. The square shape is the optimal design for maintaining control.'
                    image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/parts/HC_Expert_Wheel.png'
                  - id: ihcts_51
                    label: 'Starter Spoiler'
                    description: 'This spoiler modification is mainly for adding Speed to the Hovercraft. It minimally increases Control and Acceleration.'
                    image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/parts/HC_Trainee_Spoiler.png'
                  - id: ihcds_52
                    label: 'Dart Spoiler'
                    description: 'The Dart Spoiler allows for more Speed than the Trainee, but in turn takes away from vehicle Control.'
                    image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/parts/HC_Dart_Spoiler.png'
                  - id: ihcrs_53
                    label: 'Rapid Spoiler'
                    description: 'This spoiler modification is fully specialized towards increasing the Speed of a Hovercraft, which then has a major negative effect on the vehicle''s Control.'
                    image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/parts/HC_Rapid_Spoiler.png'
                  - id: ihcsb_54
                    label: 'Surge Booster'
                    description: 'This modification both decreases time of Acceleration and increases Speed; however, its main purpose is to increase the vehicle''s Acceleration capabilities.'
                    image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/parts/HC_Surge_Booster.png'
                  - id: ihcvb_55
                    label: 'Speed Booster'
                    description: 'This booster modification is geared towards increasing Acceleration, which negatively affects the Speed. It is a step above the Surge Booster in terms of acceleration.'
                    image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/parts/HC_Velocity_Booster.png'
                  - id: ihclb_56
                    label: 'Lightning Booster'
                    description: 'The Lighting Booster modification is designed for increasing Acceleration, but has a negative effect on Speed. In terms of Acceleration, it is more suitable than Surge and Velocity.'
                    image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/parts/HC_Lightning_Booster.png'
              - id: race_car_parts
                label: 'Race Car'
                icon: 'category_race_car_parts'
                children:
                  - id: ircbw_58
                    label: 'Balanced Wheel'
                    description: 'The RC Balanced Wheel is a wheel modification that offers greater control of a Race Car, while increasing Speed and Acceleration. This is a trusty, well-rounded modification.'
                    image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/parts/RC_Balanced_Wheel.png'
                  - id: ircsw_59
                    label: 'Standard Wheel'
                    description: 'The RC Standard Wheel modification is aimed towards increasing Control of the Race Car, but increases Acceleration time. The grip is of the same material as the HC Standard Wheel, offering greater grip.'
                    image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/parts/RC_Standard_Wheel.png'
                  - id: ircew_60
                    label: 'Expert Wheel'
                    description: 'The Expert Wheel modification is fully specialized to increase Control, but greatly impacts the Acceleration. The similar square shape of the HC Expert Wheel contributes to Control.'
                    image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/parts/RC_Expert_Wheel.png'
                  - id: ircts_61
                    label: 'Starter Spoiler'
                    description: 'This spoiler modification allows for greater Speed of the Car, but only increases control and acceleration capabilities minimally.'
                    image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/parts/RC_Trainee_Spoiler.png'
                  - id: ircds_62
                    label: 'Dart Spoiler'
                    description: 'The Dart Spoiler allows for greater speed than the Trainee but then takes away from vehicle control.'
                    image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/parts/RC_Dart_Spoiler.png'
                  - id: ircrs_63
                    label: 'Rapid Spoiler'
                    description: 'This spoiler modification is designed for increasing the Speed of a Race Car, which then has a negative effect on the vehicle''s Control.'
                    image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/parts/RC_Rapid_Spoiler.png'
                  - id: ircgt_64
                    label: 'Grip Tires'
                    description: 'This modification decreases time of Acceleration, and increases Speed but is to be added mainly to amplify Acceleration.'
                    image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/parts/RC_Grip_Tires.png'
                  - id: ircct_65
                    label: 'Clutch Tires'
                    description: 'The RC Clutch Tires are geared towards increasing acceleration capabilities more than the Grip Tires do, which has a greater negative effect on the Speed.'
                    image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/parts/RC_Clutch_Tires.png'
                  - id: ircrt_66
                    label: 'Rush Tires'
                    description: 'The RC Rush Tires are designed for greater Acceleration capabilities than the Clutch, but have an even greater negative effect on Speed.'
                    image: 'https://raw.githubusercontent.com/TOTHEMOONUNIVERSE/moondex/main/assets/cryptonaut/parts/RC_Rush_Tires.png'
      - id: duos
