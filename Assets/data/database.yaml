            image: 'https://ipfs.tothemoon.net/ipfs/QmQqvvJ7fLPtzpENyMQhTtyNMHPtwVCwbwoySKmyd51V98'
            gender: 'male male'
          - id: cder
            label: 'Emyra x Ridley'
            description: 'The sensibility of these two are what bonds them together. Fortunately, there is a splash of positivity and the ability to dream big which steady the scales.'
            image: 'https://ipfs.tothemoon.net/ipfs/QmbbJmv6WFsCRybsyPfUTaRdtv4u2mmwAFBEsGk9JKamFW'
            gender: 'female male'
          - id: cdss
            label: 'Sheldon x Saturn'
